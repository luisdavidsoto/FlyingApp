.em{border-color:var(--red);color:var(--red);font-weight:600}

textarea{height:60vh;resize:none}

.cs{display:none}.cs.on{display:block}

function parseAip(T) {
  const out = { info: [], ch: {}, idx: false }, D = '-\u00ad\u2010-\u2015', pn = {};
  const reH = new RegExp('AD\\s*2\\s*S[KQ][A-Z]{2}\\s*[' + D + ']\\s*(\\d{1,3})\\b');
  T.forEach((t, i) => { const m = t.slice(0, 300).match(reH); if (m && !(m[1] in pn)) pn[m[1]] = i + 1; });
  const reI = /S[KQ][A-Z]{2}\s+AD\s*2\.(\d{1,2})\s+([A-ZÁÉÍÓÚÑ0-9][A-ZÁÉÍÓÚÑ0-9 ,\/\-\.()]{3,90}?)(?=\s+S[KQ][A-Z]{2}\s+AD\s*2\.|[^A-ZÁÉÍÓÚÑ0-9 ,\/\-\.()]|$)/g;
  T.forEach((t, i) => { for (const m of t.matchAll(reI)) { const n = +m[1]; if (n > 24 || out.info.some(x => x[0] === n)) continue; out.info.push([n, m[2].split(/\.\s|\sS[KQ][A-Z]{2}\s/)[0].trim().slice(0, 70), i + 1]); } });
  const reC = new RegExp('AD\\s*2\\s*S[KQ][A-Z]{2}\\s*[' + D + ']\\s*(\\d{1,3})\\b', 'g');
  const f24 = T.findIndex(t => /AD\s*2\.24/.test(t)); const seen = new Set();
  if (f24 >= 0) for (let i = f24; i < Math.min(T.length, f24 + 4); i++) {
    const body = T[i], hm = body.slice(0, 250).match(reH); let last = hm ? hm.index + hm[0].length : 0;
    for (const m of body.matchAll(reC)) {
      if (m.index < last) continue;
      let title = body.slice(last, m.index).replace(/\s+/g, ' ').trim(); last = m.index + m[0].length;
      title = title.replace(/^.*(CHARTS RELATED TO AN AERODROME|RELATIVAS? AL AER[ÓO]DROMO)\s*/i, '').replace(/^[|\s.:-]+/, '').slice(-90);
      const pg = pn[m[1]];
      if (!pg || title.length < 3 || /AIRAC|AIP COLOMBIA|AIS COLOMBIA/i.test(title) || seen.has(title + pg)) continue;
      seen.add(title + pg); const cat = CATS.find(c => c[1].test(title))[0]; (out.ch[cat] = out.ch[cat] || []).push([title, pg]);
    }
  }
  out.idx = Object.keys(out.ch).length > 0;
  if (!out.idx) T.forEach((t, i) => {
    if (t.length > 1500) return; const head = t.slice(0, 700);
    for (const c of CATS.slice(0, 6)) if (c[1].test(head)) { (out.ch[c[0]] = out.ch[c[0]] || []).push([head.replace(/AIP|COLOMBIA|AIS COLOMBIA|AIRAC AMDT \d+\/\d+|\d{1,2} [A-Z]{3} \d{4}/g, '').trim().slice(0, 60) || 'Hoja', i + 1]); break; }
  });
  return out;
}

async function autoSync(force){
  if(syncing||!AIPIDX||!navigator.onLine)return;
  const idx=AIPIDX.airports,todo=wantedList().filter(ic=>!isSaved(ic)),cp=await cartasPending();
  autoNotam();
  if(!todo.length&&!cp.length){ls.set('sync_t',Date.now());syncMsg('');return}
  if(!force&&Date.now()-ls.get('sync_ask',0)<7*86400e3&&ls.get('sync_ok',0)===0&&ls.get('sync_declined',0))return;
  const bytes=todo.reduce((s,ic)=>s+idx[ic].size,0)+cp.reduce((s,m)=>s+m.size,0);
  const fvs=aipFavs();todo.sort((x,y)=>fvs.includes(y)-fvs.includes(x));
  try{const e=await navigator.storage.estimate();if(e&&e.quota&&e.quota-e.usage<bytes*1.1){
    const free=e.quota-e.usage,fb=todo.filter(ic=>fvs.includes(ic)).reduce((s,ic)=>s+idx[ic].size,0)+cp.reduce((s,m)=>s+m.size,0);
    
    syncMsg('⚠️ No hay espacio suficiente para guardar ≈'+mb(bytes)+'. Libera espacio en el dispositivo.');return}}catch(e){}
  if(!ls.get('sync_ok',0)||force&&bytes>150*1048576&&!ls.get('sync_ok2',0)){
    if(!confirm('Se guardarán ≈'+mb(bytes)+' para usar los AIP sin conexión. Conviene usar Wi-Fi y mantener la app abierta mientras descarga. ¿Continuar?')){ls.set('sync_declined',Date.now());ls.set('sync_ask',Date.now());syncMsg('');return}
    ls.set('sync_ok',1);ls.set('sync_ok2',1)}
  syncing=true;let fails=0,n=0,noSpace=false;const total=todo.length+cp.length;
  try{
    for(const ic of todo){
      if(!navigator.onLine)break;
      syncMsg('⬇️ Guardando AIP '+ic+' ('+(n+1)+'/'+total+')… no cierres la app');
      try{await saveAip(ic);fails=0;await refreshSaved();try{await ensureAipIndex(ic,(i,n)=>syncMsg('Creando índice de cartas: '+ic+' '+i+'/'+n))}catch(x){}}catch(e){fails++;if(e&&e.name==='QuotaExceededError'){noSpace=true;break}if(fails>=3)break}
      n++;await refreshSaved();renderApts()}
    for(const m of cp){
      if(!navigator.onLine||fails>=3)break;
      syncMsg('⬇️ Guardando '+m.label+' ('+(n+1)+'/'+total+')…');
      try{const c=await caches.open(CN);await c.add(cPath(m));fails=0}catch(e){fails++}
      n++}
    const left=wantedList().filter(ic=>!isSaved(ic)).length;
    syncMsg(left?(noSpace?'⚠️ El dispositivo se quedó sin espacio: faltan '+left+' AIP. Libera espacio o elige «Favoritos».':'Quedan '+left+' AIP por guardar. Se continuará al abrir la app con internet.'):'✓ Todo guardado para uso sin conexión.');
    if(!left)ls.set('sync_t',Date.now());
  }finally{syncing=false;await refreshSaved();renderApts();indexSaved()}
}

function parseCharts(T){
  const pn={},pnOf={};

  const k=sec.indexOf('CHARTS RELATED TO AN AERODROME');if(k>=0)sec=sec.slice(k+30);
  for(const c of ['RUTAS NORMALIZADAS','La siguiente informaci','ZONAS DE ENTRENAMIENTO TRAINING ZONES','CIRCUITO DE TRANSITO DE AER']){const j=sec.indexOf(c);if(j>0)sec=sec.slice(0,j)}

    .replace(new RegExp('(?:AIP\\s+)?AIS COLOMBIA A \\d+/\\d+\\s+AIP\\s+AD\\s*2\\s*S[KQ][A-Z]{2}\\s*['+DSH+']?\\s*\\d+\\s*COLOMBIA\\s+(?:AIRAC effective date )?\\d+ [A-Z]+ \\d+','g'),'')
    .replace(/AIRAC effective date \d+ [A-Z]+ \d+/g,'').replace(/AIS COLOMBIA A \d+\/\d+(\s+AIP)?/g,'').replace(/COLOMBIA\s+\d{1,2} [A-Z]{3} \d{4}/g,'').replace(/Charts Pages/g,'');
  const ev=[];
  for(const [g,re] of KWS){re.lastIndex=0;let m;while((m=re.exec(sec)))ev.push({pos:m.index,t:'k',g,end:m.index+m[0].length})}
  { const re=new RegExp(PGRE.source,'g');let m;while((m=re.exec(sec)))ev.push({pos:m.index,t:'p',n:+m[1],end:m.index+m[0].length}) }

    let j=i+1,pg=null;while(j<ev.length){if(ev[j].t==='p'){pg=ev[j];break}if(ev[j].t==='k'&&ev[j].pos>=ev[i].end)break;j++}
    if(!pg)continue;

  const rows=its.filter(i=>i.x>200&&i.x<300&&FR.test(i.s)).sort((a,b)=>a.p-b.p||b.y-a.y);
  if(!rows.length)return [];
  const R=rows.map(r=>{const m=r.s.match(FR);const f=(+(m[1]+'.'+m[2])).toFixed(3);
    const hrs=its.filter(i=>i.p===r.p&&i.x>=290&&i.x<390&&Math.abs(i.y-r.y)<=4&&/H24|HJ|\d{4}|SR|SS|MON|SUN/i.test(i.s)).sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ');
    return {p:r.p,y:r.y,f,hrs,rem:[]}});
  its.filter(i=>i.x>=462&&i.s!=='NIL').forEach(i=>{let b=null,bd=1e9;R.forEach(r=>{if(r.p!==i.p)return;const d=Math.abs(r.y-i.y);if(d<bd){bd=d;b=r}});if(b&&bd<=34)b.rem.push(i)});
  R.forEach(r=>{let t=r.rem.sort((a,b)=>b.y-a.y).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();t=t.split(/ \/ | Main | Disponible| Available/)[0].replace(/\s+(NIL)\s*$/,'').trim();r.rem=/^(Frecuencia principal|Principal|Alterna|Alternativa|Emergencia|Sector|Autorizacion|SMC|GND|CLD|DEL|Superficie|Escuela|VFR|IFR|Salida|Llegada|Norte|Sur|Este|Oeste|D ATIS|Datos|Entrenamiento|Pista|RWY|Rodaje)/i.test(t)?t.slice(0,32):''});
  const labs=its.filter(i=>i.x<135&&/^[A-Z]{2,6}$/.test(i.s)&&i.s!=='NIL').sort((a,b)=>a.p-b.p||b.y-a.y);
  const out=[];
  const pages=[...new Set(R.map(r=>r.p))].sort((x,y)=>x-y);
  let carry=null;
  for(const p of pages){
    const rp=R.filter(r=>r.p===p),lp=labs.filter(l=>l.p===p),n=rp.length,m=lp.length,S=(SP&&SP[p])||[];
    const callOf=(l,lo,hi)=>its.filter(i=>i.p===p&&i.x>=135&&i.x<215&&(lo===undefined?Math.abs(i.y-l.y)<=13:(i.y<=hi+1&&i.y>=lo-1))).sort((a,b)=>b.y-a.y).map(i=>i.s).join(' ');
    if(S.length>=2){
      const blk=y=>{let k=-1;for(let q=0;q<S.length;q++)if(S[q]>y)k=q;return k}; // bloque k = entre S[k] y S[k+1]
      const lab={};lp.forEach(l=>{const k=blk(l.y);if(!lab[k])lab[k]={svc:l.s,call:callOf(l,S[k+1]===undefined?-1e9:S[k+1],S[k]===undefined?1e9:S[k])||callOf(l)}});
      let prev=carry;
      rp.forEach(r=>{const k=blk(r.y);let l=lab[k];
        if(!l){ // bloque sin etiqueta: continúa el anterior

        else prev=l;
        out.push({svc:l?l.svc:'',call:l?l.call:'',f:r.f,hrs:r.hrs,rem:r.rem,k:''})});
      carry=prev;continue}
    // sin bordes legibles: reparto por posición
    let asg=new Array(n).fill(-1);
    if(m&&n>=m){
      const INF=1e12,dp=[],bk=[];for(let k=0;k<=m;k++){dp.push(new Array(n+1).fill(INF));bk.push(new Array(n+1).fill(-1))}dp[0][0]=0;
      for(let k=1;k<=m;k++)for(let j=k;j<=n;j++)for(let i=k-1;i<j;i++){if(dp[k-1][i]>=INF)continue;const c=dp[k-1][i]+Math.abs((rp[i].y+rp[j-1].y)/2-lp[k-1].y);if(c<dp[k][j]){dp[k][j]=c;bk[k][j]=i}}
      if(dp[m][n]<INF){let j=n;for(let k=m;k>=1;k--){const i=bk[k][j];for(let q=i;q<j;q++)asg[q]=k-1;j=i}}
    }else if(m){rp.forEach((r,q)=>{let b=0,bd=1e9;lp.forEach((l,k)=>{const d=Math.abs(l.y-r.y);if(d<bd){bd=d;b=k}});asg[q]=b})}
    rp.forEach((r,q)=>{const l=asg[q]>=0?lp[asg[q]]:null;
      const o={svc:l?l.s:(carry?carry.svc:''),call:l?callOf(l):(carry?carry.call:''),f:r.f,hrs:r.hrs,rem:r.rem,k:''};out.push(o);carry={svc:o.svc,call:o.call}});
  }
  return out;
}
function parseNav(all){
  const below=numRow(all),its=all.filter(below),out=[];
  const ANC=/^(DVOR\/DME|VOR\/DME|DVOR|VOR|NDB\/DME|NDB|DME\/P|DME|TACAN|TAC|LOC|GP|LLZ|MKR|GBAS)(\s+\d{2}[LRC]?)?$/i;
  const anchors=its.filter(i=>i.x<140&&ANC.test(i.s)).sort((a,b)=>a.p-b.p||b.y-a.y);
  anchors.forEach(a=>{
    const near=its.filter(i=>i.p===a.p&&Math.abs(i.y-a.y)<=22);
    const idc=near.filter(i=>i.x>=185&&i.x<236&&/^[A-Z0-9]{2,4}$/.test(i.s)&&!/^(MHZ|KHZ|NIL|H24)$/i.test(i.s)).sort((x,y)=>Math.abs(x.y-a.y)-Math.abs(y.y-a.y))[0];
    const num=near.filter(i=>i.x>=225&&i.x<296&&/^\d{2,4}(?:[.,]\d{1,3})?$/.test(i.s)).sort((x,y)=>Math.abs(x.y-a.y)-Math.abs(y.y-a.y))[0];
    const unit=near.filter(i=>i.x>=225&&i.x<296&&/^[MK]HZ$/i.test(i.s)).sort((x,y)=>Math.abs(x.y-a.y)-Math.abs(y.y-a.y))[0];
    const ch=near.filter(i=>/CH\s?\d+[XY]/i.test(i.s)).sort((x,y)=>Math.abs(x.y-a.y)-Math.abs(y.y-a.y))[0];
    let fr='';if(num){const v=parseFloat(num.s.replace(',','.'));const u=unit?unit.s.toUpperCase():(v>=108&&v<=340?'MHZ':'KHZ');fr=(u==='KHZ'?String(v):v.toFixed(v>=1000?0:2))+' '+(u==='KHZ'?'kHz':'MHz')}
    const id=idc?idc.s:'';const chs=ch?(ch.s.match(/CH\s?\d+[XY]/i)||[''])[0].replace(/\s/,''):'';
    if(!id&&!fr&&!chs)return;
    if(out.some(o=>o.t===a.s.toUpperCase()&&o.id===id&&o.f===fr&&o.ch===chs))return;
    out.push({t:a.s.toUpperCase(),id,f:fr,ch:chs})});
  return out;
}

  opts=opts||{};const code=opts.code||ls.get('sync_code','');
  if(!code)return {ok:false,msg:'Sin código'};
  if(!navigator.onLine)return {ok:false,msg:'Sin conexión'};
  if(nsBusy)return {ok:false,msg:'Ocupado'};
  nsBusy=true;
  try{
    const k=await getSKey(code),sid=await sidOf(code),local=nsLocal(),payload={};
    for(const id in local){const r=local[id];payload[id]={t:r.t,v:r.v===null?null:await encNote(k,r.v)}}
    const r=await fetchT(WORKER+'/notes/sync',15000,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid,notes:payload,join:!!opts.join})});
    if(!r.ok)throw new Error('El servidor respondió '+r.status);
    const j=await r.json();
    if(opts.join&&!j.existing)return {ok:true,existing:false};
    let changed=0;
    for(const id in (j.notes||{})){
      const rec=j.notes[id],l=local[id];if(l&&l.t>=rec.t)continue;
      if(rec.v===null){if(l&&l.v!==null){rmKey('nt_'+id);rmKey('ntm_'+id)}ls.set('ntd_'+id,rec.t);changed++}
      else{let txt;try{txt=await decNote(k,rec.v)}catch(e){continue}ls.set('nt_'+id,txt);ls.set('ntm_'+id,rec.t);rmKey('ntd_'+id);changed++}}
    if(!opts.join){ls.set('sync_t',Date.now());ls.set('sync_err','')}
    if(changed){try{planRefresh()}catch(e){}}
    if(changed&&$('#pNotes').offsetParent!==null){if(!nid)drawNotes(null);else if(document.activeElement!==$('#nt'))$('#nt').value=nGet(nid)}
    return {ok:true,existing:true,changed}}
  catch(e){const m=String((e&&e.message)||e);if(!opts.join)ls.set('sync_err',m);return {ok:false,msg:m}}
  finally{nsBusy=false;updateSyncUI()}}
function scheduleNotesSync(){if(!ls.get('sync_code',''))return;clearTimeout(nsTimer);nsTimer=setTimeout(()=>syncNotes(),4000)}
function syncPanelHtml(){
  const code=ls.get('sync_code','');
  if(!code)return '<div class="ap" style="padding:12px;margin-top:12px"><b>☁️ Sincronizar entre iPad e iPhone</b><p class="s">Para ver las mismas notas en tus dos equipos. Se cifran antes de salir de tu equipo y solo se abren con tu código.</p><div class="row"><button class="p" id="nsyn_new">Activar (crear código)</button><button id="nsyn_join">Ya tengo un código</button></div></div>';
  const t=ls.get('sync_t',0),er=ls.get('sync_err','');
  return '<div class="ap" style="padding:12px;margin-top:12px"><b>☁️ Sincronización activa</b><p class="s" id="nsyn_st">'+(er?'⚠️ '+esc(er)+' · ':'')+(t?'Última vez: '+fmtDate(t)+' ('+ago(t)+')':'Aún no se ha sincronizado')+'</p><div class="row"><button class="p" id="nsyn_now">Sincronizar ahora</button><button id="nsyn_show">Ver código</button></div><div class="row"><button id="nsyn_off">Desactivar en este equipo</button></div></div>'}
$('#pNotes').addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b||!b.id||!b.id.startsWith('nsyn_'))return;
  if(b.id==='nsyn_new'){
    if(!navigator.onLine){alert('Necesitas internet para activar la sincronización.');return}
    b.disabled=true;const code=genCode();ls.set('sync_code',code);
    const r=await syncNotes();
    if(!r.ok){rmKey('sync_code');alert('No se pudo activar la sincronización: '+(r.msg||'')+'. Revisa que el Worker esté actualizado.');drawNotes(null);return}
    prompt('Este es tu código. Escríbelo en tu otro equipo (Notas → «Ya tengo un código»). Guárdalo bien:',fmtCode(code));drawNotes(null);return}
  if(b.id==='nsyn_join'){
    const raw=prompt('Escribe el código de sincronización (el que creaste en tu otro equipo):','');if(raw===null)return;
    const code=normCode(raw);if(!code){alert('El código debe tener 16 letras y números (por ejemplo ABCD-EFGH-JKLM-NPQR).');return}
    if(!navigator.onLine){alert('Necesitas internet para conectar este equipo.');return}
    b.disabled=true;let r=await syncNotes({code,join:true});
    if(!r.ok){alert('No se pudo conectar: '+(r.msg||''));b.disabled=false;return}
    if(!r.existing&&!confirm('Ese código todavía no existe. Revisa que lo escribiste igual. ¿Quieres crear un espacio nuevo con ese código?')){b.disabled=false;return}
    ls.set('sync_code',code);r=await syncNotes();
    if(!r.ok){rmKey('sync_code');alert('No se pudo activar la sincronización: '+(r.msg||''))}
    drawNotes(null);return}
  if(b.id==='nsyn_now'){b.disabled=true;b.textContent='Sincronizando…';await syncNotes();drawNotes(null);return}
  if(b.id==='nsyn_show'){prompt('Tu código de sincronización:',fmtCode(ls.get('sync_code','')));return}
  if(b.id==='nsyn_off'){if(!confirm('¿Dejar de sincronizar en este equipo? Tus notas se quedan aquí.'))return;rmKey('sync_code');rmKey('sync_t');rmKey('sync_err');drawNotes(null)}
});
window.addEventListener('online',()=>{if(ls.get('sync_code',''))setTimeout(()=>syncNotes(),1500)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&ls.get('sync_code','')&&Date.now()-ls.get('sync_t',0)>120000)syncNotes()});
setTimeout(()=>{if(ls.get('sync_code',''))syncNotes()},3500);

/* ===== METAR / TAF (se guarda la última consulta y abre sin conexión) ===== */
async function wxGet(ic){
  for(const base of [WORKER+'/wx','https://aviationweather.gov/api/data']){
    let m='',f='',ok=false;
    try{const r=await fetchT(base+'/metar?ids='+ic+'&format=raw&hours=3',9000);if(r.ok){ok=true;m=(await r.text()).trim()}}catch(e){}
    try{const r=await fetchT(base+'/taf?ids='+ic+'&format=raw',9000);if(r.ok){ok=true;f=(await r.text()).trim()}}catch(e){}
    if(ok)return {m,f}}
  return null}
$('#pMetar').innerHTML='<div class="row" style="margin:0 0 8px"><input type="text" id="mi" placeholder="OACI (ej. SKMD)" maxlength="4" autocapitalize="characters" autocorrect="off" spellcheck="false" style="text-transform:uppercase"><button class="p" id="mg" style="flex:0 0 120px">Consultar</button></div>'+
 '<div id="mrc" class="tabs"></div><div class="row" style="margin:0 0 6px"><button id="mclr">🗑️ Borrar búsquedas</button></div><div id="ms" class="s"></div><pre id="mo" class="mo"></pre>'+
 '<div class="row"><a class="it lk" href="https://meteorologia.aerocivil.gov.co/wxwatch/table?list_id=1" target="_blank" rel="noopener">🌦️ Aerocivil (oficial)</a><a class="it lk" href="https://meteorologia.aerocivil.gov.co/satellite_image" target="_blank" rel="noopener">🛰️ Satélite</a></div>'+
 '<p class="s">Fuente: aviationweather.gov (copia de la información oficial). Se guarda la última consulta de cada aeropuerto para verla sin conexión. Confirma siempre con la fuente oficial antes de volar.</p>';
function metRecents(){const r=ls.get('metar_recent',[]);$('#mrc').innerHTML=r.map(c=>'<span class="chipx"><button class="chip" data-i="'+c+'">'+c+'</button><button class="chip x" data-d="'+c+'" aria-label="Quitar '+c+'">✕</button></span>').join('');$('#mclr').style.display=(r.length||ls.get('metar_last',''))?'':'none'}
function metShow(ic,rec,note){$('#mo').textContent=rec?rec.t:'';$('#ms').textContent=rec?(note+' · '+ic+' · '+fmtDate(rec.ts)+' ('+ago(rec.ts)+')'):note}
async function consultMetar(ic){
  ic=(ic||'').toUpperCase().trim();
  if(!/^[A-Z]{4}$/.test(ic)){$('#ms').textContent='Escribe un código OACI de 4 letras (ej. SKMD).';return}
  $('#mi').value=ic;ls.set('metar_last',ic);
  const saved=ls.get('metar_'+ic,null);
  if(saved)metShow(ic,saved,'Guardado');else{$('#mo').textContent='';$('#ms').textContent='Consultando '+ic+'…'}
  if(saved)$('#ms').textContent+=' · actualizando…';
  const r=await wxGet(ic);
  if(r&&(r.m||r.f)){
    const rec={t:[r.m,r.f].filter(Boolean).join('\n\n'),ts:Date.now()};ls.set('metar_'+ic,rec);
    let rc=ls.get('metar_recent',[]).filter(x=>x!==ic);rc.unshift(ic);ls.set('metar_recent',rc.slice(0,8));metRecents();
    metShow(ic,rec,'En línea')}
  else if(r){metShow(ic,saved,saved?'Sin METAR/TAF nuevo para este aeropuerto. Se muestra lo último guardado':'Este aeropuerto no reporta METAR/TAF')}
  else{metShow(ic,saved,saved?'Sin conexión: se muestra la última copia guardada':'Sin conexión y sin copia guardada de '+ic)}
}
function drawMetar(){
  metRecents();const ic=ls.get('metar_last','')||'';$('#mi').value=ic;
  if(ic){const s=ls.get('metar_'+ic,null);if(s)metShow(ic,s,'Guardado');else{$('#mo').textContent='';$('#ms').textContent=''}
    if(navigator.onLine)consultMetar(ic)}
  else{$('#mo').textContent='';$('#ms').textContent='Escribe un código OACI y toca «Consultar».'}}
$('#mg').onclick=()=>consultMetar($('#mi').value);
$('#mi').onkeydown=e=>{if(e.key==='Enter'){e.target.blur();consultMetar(e.target.value)}};
function metClearView(msg){$('#mi').value='';$('#mo').textContent='';$('#ms').textContent=msg||''}
$('#mrc').onclick=e=>{
  const d=e.target.closest('button[data-d]');
  if(d){const ic=d.dataset.d;try{localStorage.removeItem('metar_'+ic)}catch(x){}ls.set('metar_recent',ls.get('metar_recent',[]).filter(x=>x!==ic));
    if(ls.get('metar_last','')===ic){try{localStorage.removeItem('metar_last')}catch(x){}metClearView('Búsqueda de '+ic+' borrada. Escribe un OACI para una nueva consulta.')}
    metRecents();return}
  const b=e.target.closest('button[data-i]');if(b)consultMetar(b.dataset.i)};
$('#mclr').onclick=()=>{
  if(!confirm('¿Borrar todas las búsquedas de METAR/TAF guardadas?'))return;
  const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('metar_'))ks.push(k)}
  ks.forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});metRecents();metClearView('Listo. Escribe un OACI para una nueva consulta.')};

/* ===== Calculadora por pestañas ===== */
function showCalc(k){
  if(!document.querySelector('#pCalc .cs[data-t="'+k+'"]'))k='d';ls.set('ctab',k);
  document.querySelectorAll('#pCalc .cs').forEach(x=>x.classList.toggle('on',x.dataset.t===k));
  document.querySelectorAll('#ctabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===k));
  if(k==='u')convRun()}
$('#ctabs').onclick=e=>{const b=e.target.closest('button[data-t]');if(b)showCalc(b.dataset.t)};

/* ===== Conversor de unidades ===== */
const UC={
 'Velocidad':{u:{'kt':1852/3600,'km/h':1/3.6,'mph':0.44704,'m/s':1,'ft/min':0.3048/60},d:['kt','km/h']},
 'Distancia':{u:{'NM':1852,'km':1000,'SM':1609.344,'m':1,'ft':0.3048,'in':0.0254},d:['NM','km']},
 'Presión':{u:{'hPa':1,'inHg':33.8638867,'mmHg':1.33322387,'kPa':10,'psi':68.9475729},d:['hPa','inHg']},
 'Temperatura':{t:1,u:{'°C':1,'°F':1,'K':1},d:['°C','°F']},
 'Volumen':{u:{'L':1,'gal US':3.785411784,'gal UK':4.54609,'qt US':0.946352946},d:['gal US','L']},
 'Peso':{u:{'kg':1,'lb':0.45359237,'g':0.001,'oz':0.028349523},d:['kg','lb']},
 'Combustible':{f:1,u:{'L':1,'gal US':3.785411784,'kg':1,'lb':1},d:['gal US','kg']}
};
let ucat=ls.get('ucat','Velocidad');if(!UC[ucat])ucat='Velocidad';
const dens=()=>parseFloat($('#ud').value)||0.72;
function toBase(c,u,v){if(c.t)return u==='°C'?v:u==='°F'?(v-32)*5/9:v-273.15;if(c.f){const d=dens();return v*(u==='kg'?1/d:u==='lb'?0.45359237/d:c.u[u])}return v*c.u[u]}
function fromBase(c,u,b){if(c.t)return u==='°C'?b:u==='°F'?b*9/5+32:b+273.15;if(c.f){const d=dens();return b/(u==='kg'?1/d:u==='lb'?0.45359237/d:c.u[u])}return b/c.u[u]}
const nf=v=>isFinite(v)?String(+v.toPrecision(7)):'–';
function convSetCat(cat,keep){
  ucat=cat;ls.set('ucat',cat);const c=UC[cat],us=Object.keys(c.u);
  document.querySelectorAll('#utabs button').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));
  const opt=s=>us.map(u=>'<option'+(u===s?' selected':'')+'>'+u+'</option>').join('');
  $('#uf').innerHTML=opt(c.d[0]);$('#ut').innerHTML=opt(c.d[1]);$('#udw').style.display=c.f?'block':'none';convRun()}
function convRun(){
  const c=UC[ucat],v=parseFloat($('#uv').value),f=$('#uf').value,t=$('#ut').value;
  if(!isFinite(v)){$('#ur').textContent='–';$('#ua').textContent='';return}
  const b=toBase(c,f,v);$('#ur').textContent=nf(v)+' '+f+' = '+nf(fromBase(c,t,b))+' '+t;
  $('#ua').innerHTML=Object.keys(c.u).filter(u=>u!==f).map(u=>nf(fromBase(c,u,b))+' '+u).join(' &nbsp;·&nbsp; ')}
$('#utabs').innerHTML=Object.keys(UC).map(k=>'<button data-c="'+k+'">'+k+'</button>').join('');
$('#utabs').onclick=e=>{const b=e.target.closest('button[data-c]');if(b)convSetCat(b.dataset.c)};
$('#usw').onclick=()=>{const a=$('#uf').value,b=$('#ut').value;$('#uf').value=b;$('#ut').value=a;convRun()};
['#uv','#uf','#ut','#ud'].forEach(s=>{$(s).addEventListener('input',convRun);$(s).addEventListener('change',convRun)});
convSetCat(ucat);

home();
